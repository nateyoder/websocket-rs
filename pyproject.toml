[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "websocket-rs-nateyoder"
# Fork versioning: "<upstream base>.postN". The upstream base is the
# websocket-rs release this fork is rebased on; N is the fork's own patch level
# and increments on every release from this repository. PEP 440 has no way to
# spell a fork marker that PyPI will accept (local versions like "+ncy1" are
# rejected on upload), so the fork identity lives in the distribution name and
# ".postN" keeps this line from ever colliding with an upstream version.
version = "0.7.10.post1"
description = "Fork of websocket-rs: high-performance WebSocket client for Python using Rust"
readme = "README.pypi.md"
authors = [
    {name = "coseto6125", email = "enorenor@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Communications",
]
keywords = ["websocket", "rust", "async", "high-performance", "client"]
dependencies = []

[project.urls]
"Homepage" = "https://github.com/nateyoder/websocket-rs"
"Documentation" = "https://github.com/nateyoder/websocket-rs/blob/main/docs/API.md"
"API Reference" = "https://github.com/nateyoder/websocket-rs/blob/main/docs/API.md"
"Source Code" = "https://github.com/nateyoder/websocket-rs"
"Bug Tracker" = "https://github.com/nateyoder/websocket-rs/issues"
"Changelog" = "https://github.com/nateyoder/websocket-rs/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Optional TLS acceleration. websocket_rs.connect() routes wss:// through
# aiofastnet automatically when it is importable and falls back to the stdlib
# ssl path otherwise, so this extra is purely a performance opt-in.
fast-tls = [
    "aiofastnet>=1.1.0,<2",
]
dev = [
    "maturin>=1.0",
    "pytest>=7.0",
    "pytest-asyncio>=1.3.0",
    "websockets>=12.0",
    "ruff>=0.1.0",
    "aiofastnet>=1.1.0,<2",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=1.3.0",
    "websockets>=12.0",
    # tests/test_tls_backends.py skips the aiofastnet cells without it.
    "aiofastnet>=1.1.0,<2",
]
benchmark = [
    "uvloop>=0.22.1",
    "websockets>=12.0",
    "websocket-client>=1.9.0",
    "picows>=0.3.0",
]

[tool.maturin]
python-source = "."
# The distribution is renamed for the fork; the import name must not change,
# so downstream code keeps `import websocket_rs` untouched.
module-name = "websocket_rs"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long
    "B008", # do not perform function calls in argument defaults
]

[dependency-groups]
dev = [
    "maturin>=1.0",
    "pytest>=7.0",
    "websockets>=12.0",
    "ruff>=0.1.0",
    "uvloop>=0.22.1; sys_platform != 'win32'",
    # rloop + granian are optional benchmark-only deps; Windows wheels aren't
    # published and the native crates use Unix-only fd primitives.
    "rloop>=0.2.0; sys_platform == 'linux'",
    "granian>=2.7.3; sys_platform != 'win32'",
    "picows>=1.18.0; sys_platform != 'win32'",
    "pytest-asyncio>=1.3.0",
    "aiofastnet>=1.1.0,<2",
]
